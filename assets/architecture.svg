<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

      .font-sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, Monaco, monospace;
      }

      .node-bg { fill: #161b22; stroke: #30363d; stroke-width: 1px; }
      .node-card { fill: #0d1117; stroke: #30363d; stroke-width: 1px; }
      .conn-line { stroke: #30363d; stroke-width: 1.5px; fill: none; }
      
      .t-title { fill: #f0f6fc; font-weight: 600; font-size: 13px; }
      .t-subtitle { fill: #8b949e; font-size: 11.5px; }
      .t-code { fill: #79c0ff; font-size: 11px; }
      .t-dim { fill: #6e7681; font-size: 11px; }
      .t-green { fill: #3fb950; font-size: 11px; }
      .t-blue { fill: #58a6ff; font-size: 11px; }
      .t-red { fill: #f85149; font-size: 11px; }

      /* Dynamic Animations */
      @keyframes dashFlow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-record {
        stroke: #58a6ff;
        stroke-width: 2px;
        stroke-dasharray: 6, 6;
        fill: none;
        animation: dashFlow 1.2s linear infinite;
      }
      .flow-replay {
        stroke: #3fb950;
        stroke-width: 2px;
        stroke-dasharray: 6, 6;
        fill: none;
        animation: dashFlow 1.2s linear infinite;
      }
      .flow-cassette {
        stroke: #8b949e;
        stroke-width: 1.5px;
        stroke-dasharray: 4, 4;
        fill: none;
        animation: dashFlow 1.8s linear infinite;
      }

      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(88, 166, 255, 0.35)); }
        50% { filter: none; }
      }
      .glow-record {
        animation: pulseGlow 3s ease-in-out infinite;
      }

      @keyframes pulseGreenGlow {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(63, 185, 80, 0.35)); }
        50% { filter: none; }
      }
      .glow-replay {
        animation: pulseGreenGlow 3s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .flow-record, .flow-replay, .flow-cassette, .glow-record, .glow-replay {
          animation: none !important;
          stroke-dasharray: none !important;
        }
      }
    ]]></style>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="860" height="380" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- ================= TOP ROOT NODE: AGENT TEST ================= -->
  <g transform="translate(290, 24)">
    <rect class="node-bg" width="280" height="54" rx="6" />
    <text class="font-sans t-title" x="140" y="24" text-anchor="middle">Agent Test Suite (pytest)</text>
    <text class="font-mono t-dim" x="140" y="42" text-anchor="middle">test_agent.py (fixture: agentreplay)</text>
  </g>

  <!-- Base connector lines -->
  <path d="M 360 78 L 360 110 L 220 110 L 220 134" class="conn-line" />
  <path d="M 500 78 L 500 110 L 640 110 L 640 134" class="conn-line" />

  <!-- Animated flow lines -->
  <path d="M 360 78 L 360 110 L 220 110 L 220 134" class="flow-record" marker-end="url(#arrow-blue)" />
  <path d="M 500 78 L 500 110 L 640 110 L 640 134" class="flow-replay" marker-end="url(#arrow-green)" />

  <!-- Mode Selector Badges on Connector Line -->
  <g transform="translate(145, 98)" class="glow-record">
    <rect width="150" height="22" rx="4" fill="#0d1117" stroke="#1f6feb" stroke-width="1" />
    <text class="font-mono t-blue" x="75" y="15" text-anchor="middle">--agentreplay=record</text>
  </g>
  <g transform="translate(565, 98)" class="glow-replay">
    <rect width="150" height="22" rx="4" fill="#0d1117" stroke="#238636" stroke-width="1" />
    <text class="font-mono t-green" x="75" y="15" text-anchor="middle">--agentreplay=replay</text>
  </g>

  <!-- ================= LEFT BRANCH: RECORD MODE ================= -->
  <g transform="translate(50, 136)">
    <!-- Container Box -->
    <rect class="node-bg" width="340" height="190" rx="6" stroke="#1f6feb" />
    
    <!-- Title -->
    <text class="font-sans" x="16" y="26" fill="#58a6ff" font-size="13" font-weight="600">RECORD MODE (Local Dev)</text>
    <line x1="0" y1="36" x2="340" y2="36" stroke="#30363d" stroke-width="1" />

    <!-- Step 1: Live Invocations -->
    <g transform="translate(16, 52)">
      <text class="font-sans t-title" x="0" y="12">1. Live Model &amp; Tool Execution</text>
      <text class="font-mono t-dim" x="0" y="28">• Real OpenAI / Anthropic / Local API</text>
      <text class="font-mono t-dim" x="0" y="44">• Real Python tool execution</text>
    </g>

    <!-- Step 2: Non-invasive Interception -->
    <g transform="translate(16, 114)">
      <text class="font-sans t-title" x="0" y="12">2. Non-Invasive Event Capture</text>
      <text class="font-mono t-dim" x="0" y="28">• Capability hooks intercept turns</text>
      <text class="font-mono t-dim" x="0" y="44">• Deep-copies arguments &amp; returns</text>
    </g>
  </g>

  <!-- ================= RIGHT BRANCH: REPLAY MODE ================= -->
  <g transform="translate(470, 136)">
    <!-- Container Box -->
    <rect class="node-bg" width="340" height="190" rx="6" stroke="#238636" />
    
    <!-- Title -->
    <text class="font-sans" x="16" y="26" fill="#3fb950" font-size="13" font-weight="600">REPLAY MODE (CI / CD)</text>
    <text class="font-mono t-green" x="324" y="25" text-anchor="end" font-weight="600">0.04s</text>
    <line x1="0" y1="36" x2="340" y2="36" stroke="#30363d" stroke-width="1" />

    <!-- Step 1: Offline Interception -->
    <g transform="translate(16, 52)">
      <text class="font-sans t-title" x="0" y="12">1. 100% Offline Interception</text>
      <text class="font-mono t-dim" x="0" y="28">• SkipModelRequest (0 API calls)</text>
      <text class="font-mono t-dim" x="0" y="44">• SkipToolExecution (0 network/side-effects)</text>
    </g>

    <!-- Step 2: Verification / Diff -->
    <g transform="translate(16, 114)">
      <text class="font-sans t-title" x="0" y="12">2. Stateful Trajectory Verification</text>
      <text class="font-mono t-dim" x="0" y="28">• Cursor matches sequence &amp; arguments</text>
      <text class="font-mono t-dim" x="0" y="44">• Raises DivergenceError on drift</text>
    </g>
  </g>

  <!-- Flow to Cassette Storage Node at Bottom -->
  <path d="M 220 326 L 220 348 L 346 348" class="flow-cassette" marker-end="url(#arrow)" />
  <path d="M 640 326 L 640 348 L 514 348" class="flow-cassette" marker-end="url(#arrow)" />

  <!-- Center Shared Cassette Artifact Node -->
  <g transform="translate(350, 330)">
    <rect class="node-card" width="160" height="36" rx="4" stroke="#8b949e" />
    <text class="font-mono" x="80" y="22" fill="#e6edf3" font-size="11" font-weight="600" text-anchor="middle">cassette.jsonl</text>
  </g>
</svg>
