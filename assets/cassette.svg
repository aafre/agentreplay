<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');

      .font-sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
      }

      /* Reel Rotation Animation */
      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      .spin-left {
        transform-origin: 290px 195px;
        animation: spinClockwise 4s linear infinite;
      }
      
      .spin-right {
        transform-origin: 560px 195px;
        animation: spinClockwise 4s linear infinite;
      }

      /* Tape Data Stream Flow Animation */
      @keyframes flowData {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-480px); }
      }
      
      .tape-data-stream {
        animation: flowData 10s linear infinite;
      }

      /* LED Rec Pulse */
      @keyframes recBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #ff5555); }
        50% { opacity: 0.3; filter: none; }
      }
      .rec-led {
        animation: recBlink 1.4s ease-in-out infinite;
      }

      /* Play LED Glow */
      @keyframes playGlow {
        0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 6px #3fb950); }
        50% { opacity: 0.5; filter: none; }
      }
      .play-led {
        animation: playGlow 2s ease-in-out infinite;
      }

      /* VU Equalizer Animations */
      @keyframes vuBar1 { 0%, 100% { height: 6px; y: 18px; } 50% { height: 18px; y: 6px; } }
      @keyframes vuBar2 { 0%, 100% { height: 14px; y: 10px; } 50% { height: 8px; y: 16px; } }
      @keyframes vuBar3 { 0%, 100% { height: 20px; y: 4px; } 50% { height: 12px; y: 12px; } }
      @keyframes vuBar4 { 0%, 100% { height: 10px; y: 14px; } 50% { height: 22px; y: 2px; } }
      
      .vu-1 { animation: vuBar1 0.8s ease-in-out infinite; }
      .vu-2 { animation: vuBar2 0.6s ease-in-out infinite; }
      .vu-3 { animation: vuBar3 0.9s ease-in-out infinite; }
      .vu-4 { animation: vuBar4 0.7s ease-in-out infinite; }

      /* Tape Head Glow */
      @keyframes headPulse {
        0%, 100% { fill: #58a6ff; opacity: 0.8; filter: drop-shadow(0 0 8px #58a6ff); }
        50% { fill: #388bfd; opacity: 0.3; filter: none; }
      }
      .head-laser {
        animation: headPulse 2s infinite ease-in-out;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" />
      <stop offset="50%" stop-color="#161f2e" />
      <stop offset="100%" stop-color="#13233a" />
    </linearGradient>

    <linearGradient id="tapePackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="50%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="25%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="75%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <clipPath id="windowClip">
      <rect x="200" y="130" width="450" height="130" rx="12" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="850" height="420" fill="#0d1117" rx="14" />
  
  <!-- Outer Grid Ambient Background Pattern -->
  <g opacity="0.08">
    <path d="M0,35 H850 M0,70 H850 M0,105 H850 M0,140 H850 M0,175 H850 M0,210 H850 M0,245 H850 M0,280 H850 M0,315 H850 M0,350 H850 M0,385 H850" stroke="#58a6ff" stroke-width="1" />
    <path d="M70,0 V420 M140,0 V420 M210,0 V420 M280,0 V420 M350,0 V420 M420,0 V420 M490,0 V420 M560,0 V420 M630,0 V420 M700,0 V420 M770,0 V420" stroke="#58a6ff" stroke-width="1" />
  </g>

  <!-- ================= CASSETTE BODY ================= -->
  <g filter="url(#shadow)">
    <!-- Main Shell -->
    <rect x="80" y="30" width="690" height="360" rx="18" fill="url(#bodyGrad)" stroke="#30363d" stroke-width="2" />
    <rect x="83" y="33" width="684" height="354" rx="16" fill="none" stroke="#21262d" stroke-width="1" />

    <!-- Corner Screws -->
    <g fill="#484f58">
      <circle cx="102" cy="52" r="5" /><line x1="99" y1="52" x2="105" y2="52" stroke="#21262d" stroke-width="1.5" />
      <circle cx="748" cy="52" r="5" /><line x1="745" y1="52" x2="751" y2="52" stroke="#21262d" stroke-width="1.5" />
      <circle cx="102" cy="368" r="5" /><line x1="99" y1="368" x2="105" y2="368" stroke="#21262d" stroke-width="1.5" />
      <circle cx="748" cy="368" r="5" /><line x1="745" y1="368" x2="751" y2="368" stroke="#21262d" stroke-width="1.5" />
      <circle cx="425" cy="52" r="5" /><line x1="422" y1="52" x2="428" y2="52" stroke="#21262d" stroke-width="1.5" />
    </g>

    <!-- Cassette Bottom Trapezoid (Head Entrance) -->
    <polygon points="180,390 230,320 620,320 670,390" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="260" cy="355" r="7" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <circle cx="590" cy="355" r="7" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

    <!-- Magnetic Head & Roller Cutouts -->
    <rect x="395" y="330" width="60" height="24" rx="4" fill="#21262d" stroke="#58a6ff" stroke-width="1" />
    <line x1="425" y1="328" x2="425" y2="356" class="head-laser" stroke-width="2" />
    <circle cx="350" cy="342" r="6" fill="#30363d" />
    <circle cx="500" cy="342" r="6" fill="#30363d" />

    <!-- ================= CASSETTE LABEL ================= -->
    <rect x="120" y="65" width="610" height="235" rx="10" fill="url(#labelGrad)" stroke="#388bfd" stroke-width="1" />

    <!-- Top Label Header -->
    <g class="font-sans">
      <!-- Brand & Model -->
      <text x="145" y="94" fill="#58a6ff" font-size="18" font-weight="800" letter-spacing="1.5">AGENTREPLAY</text>
      <text x="300" y="94" fill="#79c0ff" font-size="12" font-weight="600">C-60 DIGITAL TRACE CASSETTE</text>

      <!-- Side A Badge -->
      <rect x="655" y="78" width="55" height="24" rx="4" fill="#388bfd" />
      <text x="682" y="95" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">SIDE A</text>
    </g>

    <!-- Write-On Strip / Cassette Path -->
    <g class="font-mono">
      <rect x="140" y="104" width="570" height="20" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <text x="150" y="118" fill="#e6edf3" font-size="11">FILE: <tspan fill="#7ee787">tests/cassettes/test_support/test_refund_flow.jsonl</tspan></text>
      <text x="645" y="118" fill="#8b949e" font-size="10">v1.0</text>
    </g>

    <!-- ================= TRANSPARENT TAPE WINDOW ================= -->
    <rect x="200" y="130" width="450" height="130" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2" />
    <rect x="205" y="135" width="440" height="120" rx="8" fill="#080b0f" opacity="0.9" />

    <!-- Center Ruler / Hash Marks -->
    <g stroke="#30363d" stroke-width="1" opacity="0.6">
      <line x1="425" y1="135" x2="425" y2="155" />
      <line x1="405" y1="135" x2="405" y2="147" />
      <line x1="385" y1="135" x2="385" y2="147" />
      <line x1="445" y1="135" x2="445" y2="147" />
      <line x1="465" y1="135" x2="465" y2="147" />
      <text class="font-mono" x="425" y="166" fill="#6e7681" font-size="9" text-anchor="middle">100 • 50 • 0</text>
    </g>

    <!-- Tape Ribbon Path Across Window Bottom -->
    <line x1="200" y1="242" x2="650" y2="242" stroke="url(#ribbonGrad)" stroke-width="6" />

    <!-- ================= SPOOL REELS & TAPE PACKS ================= -->
    <!-- LEFT REEL (Supply Reel with thicker tape pack) -->
    <g>
      <!-- Magnetic Tape Pack (Left) -->
      <circle cx="290" cy="195" r="48" fill="url(#tapePackGrad)" stroke="#30363d" stroke-width="1.5" />
      
      <!-- Spinning Left Hub Assembly -->
      <g class="spin-left">
        <!-- Hub Outer Ring -->
        <circle cx="290" cy="195" r="26" fill="#f0f6fc" stroke="#c9d1d9" stroke-width="1" />
        <circle cx="290" cy="195" r="20" fill="#e6edf3" />
        <circle cx="290" cy="195" r="12" fill="#0d1117" stroke="#30363d" stroke-width="2" />
        <!-- 6 Drive Teeth/Spokes -->
        <circle cx="290" cy="179" r="3.5" fill="#30363d" />
        <circle cx="290" cy="211" r="3.5" fill="#30363d" />
        <circle cx="276" cy="187" r="3.5" fill="#30363d" />
        <circle cx="304" cy="203" r="3.5" fill="#30363d" />
        <circle cx="276" cy="203" r="3.5" fill="#30363d" />
        <circle cx="304" cy="187" r="3.5" fill="#30363d" />
      </g>
    </g>

    <!-- RIGHT REEL (Takeup Reel with smaller tape pack) -->
    <g>
      <!-- Magnetic Tape Pack (Right) -->
      <circle cx="560" cy="195" r="34" fill="url(#tapePackGrad)" stroke="#30363d" stroke-width="1.5" />
      
      <!-- Spinning Right Hub Assembly -->
      <g class="spin-right">
        <!-- Hub Outer Ring -->
        <circle cx="560" cy="195" r="26" fill="#f0f6fc" stroke="#c9d1d9" stroke-width="1" />
        <circle cx="560" cy="195" r="20" fill="#e6edf3" />
        <circle cx="560" cy="195" r="12" fill="#0d1117" stroke="#30363d" stroke-width="2" />
        <!-- 6 Drive Teeth/Spokes -->
        <circle cx="560" cy="179" r="3.5" fill="#30363d" />
        <circle cx="560" cy="211" r="3.5" fill="#30363d" />
        <circle cx="546" cy="187" r="3.5" fill="#30363d" />
        <circle cx="574" cy="203" r="3.5" fill="#30363d" />
        <circle cx="546" cy="203" r="3.5" fill="#30363d" />
        <circle cx="574" cy="187" r="3.5" fill="#30363d" />
      </g>
    </g>

    <!-- ================= ROLLING JSONL DATA STREAM ================= -->
    <g clip-path="url(#windowClip)">
      <g class="tape-data-stream font-mono" transform="translate(0, 0)">
        <!-- Stream Line 1 -->
        <text x="210" y="210" fill="#58a6ff" font-size="11" opacity="0.85">{"kind":"run_start"} ➔ {"kind":"model_request","name":"gpt-4o"} ➔ {"kind":"tool_result","name":"lookup_customer"} ➔ {"kind":"tool_result","name":"check_policy"} ➔ {"kind":"model_response"} ➔ {"kind":"run_end"}</text>
        <text x="690" y="210" fill="#58a6ff" font-size="11" opacity="0.85">{"kind":"run_start"} ➔ {"kind":"model_request","name":"gpt-4o"} ➔ {"kind":"tool_result","name":"lookup_customer"} ➔ {"kind":"tool_result","name":"check_policy"} ➔ {"kind":"model_response"} ➔ {"kind":"run_end"}</text>
        <text x="1170" y="210" fill="#58a6ff" font-size="11" opacity="0.85">{"kind":"run_start"} ➔ {"kind":"model_request","name":"gpt-4o"} ➔ {"kind":"tool_result","name":"lookup_customer"} ➔ {"kind":"tool_result","name":"check_policy"} ➔ {"kind":"model_response"} ➔ {"kind":"run_end"}</text>
      </g>
    </g>

    <!-- Glass Reflection Highlights -->
    <polygon points="205,135 290,135 240,255 205,255" fill="#ffffff" opacity="0.04" />
    <polygon points="320,135 370,135 280,255 250,255" fill="#ffffff" opacity="0.02" />

    <!-- Bottom Label Info & Metadata -->
    <g class="font-sans" transform="translate(140, 272)">
      <text x="0" y="16" fill="#8b949e" font-size="11" font-weight="600">CANONICAL JSONL • UTF-8 • SORTED KEYS • ZERO NETWORK REPLAY</text>
      <text class="font-mono" x="570" y="16" fill="#3fb950" font-size="11" font-weight="700" text-anchor="end">DETERMINISTIC</text>
    </g>
  </g>

  <!-- ================= DECK STATUS & TELEMETRY BAR ================= -->
  <!-- REC LED Indicator -->
  <g transform="translate(110, 345)">
    <circle cx="8" cy="8" r="5" fill="#f85149" class="rec-led" />
    <text class="font-sans" x="18" y="12" fill="#ffa198" font-size="11" font-weight="700">REC</text>
  </g>

  <!-- PLAY LED Indicator -->
  <g transform="translate(170, 345)">
    <circle cx="8" cy="8" r="5" fill="#3fb950" class="play-led" />
    <text class="font-sans" x="18" y="12" fill="#7ee787" font-size="11" font-weight="700">REPLAY (0.04s)</text>
  </g>

  <!-- Realtime Audio / Data VU Equalizer Graphic -->
  <g transform="translate(670, 338)">
    <rect x="0" y="10" width="4" height="14" rx="2" fill="#388bfd" class="vu-1" />
    <rect x="7" y="14" width="4" height="10" rx="2" fill="#58a6ff" class="vu-2" />
    <rect x="14" y="6" width="4" height="18" rx="2" fill="#3fb950" class="vu-3" />
    <rect x="21" y="2" width="4" height="22" rx="2" fill="#7ee787" class="vu-4" />
    <rect x="28" y="8" width="4" height="16" rx="2" fill="#58a6ff" class="vu-2" />
    <rect x="35" y="12" width="4" height="12" rx="2" fill="#388bfd" class="vu-1" />
    <text class="font-mono" x="46" y="19" fill="#8b949e" font-size="10">TRK 01</text>
  </g>
</svg>
