<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

      .font-sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, Monaco, monospace;
        font-size: 11.5px;
        line-height: 18px;
      }

      /* GitHub Dark Syntax Tokens */
      .c-bg { fill: #0d1117; }
      .c-pane-bg { fill: #161b22; }
      .c-inner-bg { fill: #090d13; }
      .c-border { stroke: #30363d; stroke-width: 1px; fill: none; }
      .c-border-subtle { stroke: #21262d; stroke-width: 1px; fill: none; }
      
      .c-text { fill: #e6edf3; }
      .c-muted { fill: #8b949e; }
      .c-dim { fill: #6e7681; }
      .c-blue { fill: #58a6ff; }
      .c-green { fill: #3fb950; }
      .c-red { fill: #f85149; }
      .c-amber { fill: #d29922; }
      .c-purple { fill: #bc8cff; }

      .diff-del-bg { fill: #3b1219; }
      .diff-del-text { fill: #ff7b72; font-weight: 500; }
      .diff-add-bg { fill: #112d1b; }
      .diff-add-text { fill: #7ee787; font-weight: 500; }

      /* Keyframe Animations */
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor-blink {
        animation: cursorBlink 1.05s infinite;
      }

      @keyframes connectorFlow {
        0% { stroke-dashoffset: 28; }
        100% { stroke-dashoffset: 0; }
      }
      .connector-pulse {
        stroke-dasharray: 4, 3;
        animation: connectorFlow 1.2s linear infinite;
      }

      @keyframes badgePulse {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px rgba(63, 185, 80, 0.4)); }
        50% { opacity: 0.75; filter: none; }
      }
      .badge-live {
        animation: badgePulse 2.4s ease-in-out infinite;
      }

      @keyframes alertGlow {
        0%, 100% { stroke: #f85149; stroke-opacity: 0.8; }
        50% { stroke: #da3633; stroke-opacity: 0.3; }
      }
      .alert-box {
        animation: alertGlow 2s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .cursor-blink, .connector-pulse, .badge-live, .alert-box {
          animation: none !important;
        }
      }
    ]]></style>
  </defs>

  <!-- Terminal Window Base Canvas -->
  <rect class="c-bg" x="0" y="0" width="960" height="450" rx="8" />
  <rect class="c-border" x="0.5" y="0.5" width="959" height="449" rx="8" />

  <!-- Window Header Bar -->
  <path d="M 0 8 C 0 3.5 3.5 0 8 0 L 952 0 C 956.5 0 960 3.5 960 8 L 960 38 L 0 38 Z" fill="#161b22" />
  <line x1="0" y1="38" x2="960" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="19" r="5.5" fill="#f85149" />
  <circle cx="37" cy="19" r="5.5" fill="#d29922" />
  <circle cx="54" cy="19" r="5.5" fill="#2ea043" />

  <!-- Window Title -->
  <text class="font-sans" x="480" y="23" fill="#8b949e" font-size="12" font-weight="500" text-anchor="middle">
    pytest-agentreplay — Record, Fast Offline Replay, and Structural Trajectory Diffs
  </text>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: RECORD (LOCAL DEV)                                              -->
  <!-- ========================================================================= -->
  <g transform="translate(18, 52)">
    <!-- Pane Container -->
    <rect class="c-pane-bg" x="0" y="0" width="294" height="380" rx="6" />
    <rect class="c-border" x="0.5" y="0.5" width="293" height="379" rx="6" />

    <!-- Pane Header -->
    <path d="M 0 6 C 0 2.5 2.5 0 6 0 L 288 0 C 291.5 0 294 2.5 294 6 L 294 36 L 0 36 Z" fill="#1c2128" />
    <line x1="0" y1="36" x2="294" y2="36" stroke="#30363d" stroke-width="1" />

    <circle cx="16" cy="18" r="8" fill="#1f6feb" />
    <text class="font-sans" x="16" y="22" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">1</text>
    <text class="font-sans" x="32" y="22" fill="#e6edf3" font-size="12" font-weight="600">RECORD</text>
    <text class="font-sans" x="280" y="22" fill="#8b949e" font-size="11" text-anchor="end">Local Dev</text>

    <!-- Terminal Code Block -->
    <g transform="translate(12, 48)">
      <rect class="c-inner-bg" x="0" y="0" width="270" height="318" rx="4" />
      <rect class="c-border-subtle" x="0.5" y="0.5" width="269" height="317" rx="4" />

      <g class="font-mono" transform="translate(12, 22)">
        <!-- Command line with cursor -->
        <text x="0" y="0"><tspan class="c-dim">$ </tspan><tspan class="c-text">pytest </tspan><tspan class="c-blue">--agentreplay=record</tspan></text>
        
        <!-- Output -->
        <text x="0" y="26" class="c-dim">collecting ... 1 item</text>
        
        <text x="0" y="58" class="c-blue" font-weight="600">RECORD</text>
        <text x="52" y="58" class="c-muted">tests/cassettes/</text>
        <text x="0" y="76" class="c-muted">test_refund_flow.jsonl</text>
        
        <text x="0" y="112" class="c-green">✓</text>
        <text x="14" y="112" class="c-text">Intercepted via capability</text>

        <text x="0" y="136" class="c-green">✓</text>
        <text x="14" y="136" class="c-text">Captured 2 model turns</text>

        <text x="0" y="160" class="c-green">✓</text>
        <text x="14" y="160" class="c-text">Recorded 2 tool calls:</text>
        <text x="14" y="180" class="c-dim">↳ lookup_customer(123)</text>
        <text x="14" y="198" class="c-dim">↳ check_policy(&quot;gold&quot;)</text>

        <text x="0" y="230" class="c-green">✓</text>
        <text x="14" y="230" class="c-text">Saved canonical JSONL</text>

        <!-- Summary line -->
        <line x1="0" y1="250" x2="246" y2="250" stroke="#21262d" stroke-width="1" />
        <text x="0" y="272"><tspan class="c-green" font-weight="600">1 passed</tspan><tspan class="c-dim"> in 2.14s</tspan></text>
      </g>
    </g>
  </g>

  <!-- Animated Flow Connector 1 -> 2 -->
  <g transform="translate(314, 232)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#58a6ff" stroke-width="1.5" class="connector-pulse" />
    <polyline points="12,-4 17,0 12,4" fill="none" stroke="#58a6ff" stroke-width="1.5" />
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: REPLAY (100% OFFLINE CI)                                        -->
  <!-- ========================================================================= -->
  <g transform="translate(333, 52)">
    <!-- Pane Container -->
    <rect class="c-pane-bg" x="0" y="0" width="294" height="380" rx="6" />
    <rect class="c-border" x="0.5" y="0.5" width="293" height="379" rx="6" />

    <!-- Pane Header -->
    <path d="M 0 6 C 0 2.5 2.5 0 6 0 L 288 0 C 291.5 0 294 2.5 294 6 L 294 36 L 0 36 Z" fill="#1c2128" />
    <line x1="0" y1="36" x2="294" y2="36" stroke="#30363d" stroke-width="1" />

    <circle cx="16" cy="18" r="8" fill="#238636" />
    <text class="font-sans" x="16" y="22" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">2</text>
    <text class="font-sans" x="32" y="22" fill="#e6edf3" font-size="12" font-weight="600">FAST REPLAY</text>
    <g class="badge-live">
      <text class="font-sans" x="280" y="22" fill="#3fb950" font-size="11" font-weight="600" text-anchor="end">0.04s • CI / CD</text>
    </g>

    <!-- Terminal Code Block -->
    <g transform="translate(12, 48)">
      <rect class="c-inner-bg" x="0" y="0" width="270" height="318" rx="4" />
      <rect class="c-border-subtle" x="0.5" y="0.5" width="269" height="317" rx="4" />

      <g class="font-mono" transform="translate(12, 22)">
        <!-- Command line with animated cursor -->
        <text x="0" y="0"><tspan class="c-dim">$ </tspan><tspan class="c-text">pytest </tspan><tspan class="c-green">--agentreplay=replay</tspan></text>
        <rect x="238" y="-10" width="6" height="12" fill="#58a6ff" class="cursor-blink" />
        
        <!-- Output -->
        <text x="0" y="26" class="c-dim">collecting ... 1 item</text>
        
        <text x="0" y="58" class="c-green" font-weight="600">REPLAY</text>
        <text x="52" y="58" class="c-muted">tests/cassettes/</text>
        <text x="0" y="76" class="c-muted">test_refund_flow.jsonl</text>
        
        <text x="0" y="112" class="c-green">✓</text>
        <text x="14" y="112" class="c-text">Zero model API calls</text>
        <text x="14" y="130" class="c-dim">↳ SkipModelRequest</text>

        <text x="0" y="154" class="c-green">✓</text>
        <text x="14" y="154" class="c-text">Zero tool/network calls</text>
        <text x="14" y="172" class="c-dim">↳ SkipToolExecution</text>

        <text x="0" y="196" class="c-green">✓</text>
        <text x="14" y="196" class="c-text">100% deterministic</text>

        <text x="0" y="226" class="c-green">✓</text>
        <text x="14" y="226" class="c-text">Matched 4/4 trace events</text>

        <!-- Summary line -->
        <line x1="0" y1="250" x2="246" y2="250" stroke="#21262d" stroke-width="1" />
        <text x="0" y="272"><tspan class="c-green" font-weight="600">1 passed</tspan><tspan class="c-text"> in </tspan><tspan class="c-purple" font-weight="600">0.04s </tspan><tspan class="c-dim">($0.00)</tspan></text>
      </g>
    </g>
  </g>

  <!-- Animated Flow Connector 2 -> 3 -->
  <g transform="translate(629, 232)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#f85149" stroke-width="1.5" class="connector-pulse" />
    <polyline points="12,-4 17,0 12,4" fill="none" stroke="#f85149" stroke-width="1.5" />
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: CATCH REGRESSIONS (TRAJECTORY DIFF)                             -->
  <!-- ========================================================================= -->
  <g transform="translate(648, 52)">
    <!-- Pane Container -->
    <rect class="c-pane-bg" x="0" y="0" width="294" height="380" rx="6" />
    <rect class="c-border alert-box" x="0.5" y="0.5" width="293" height="379" rx="6" />

    <!-- Pane Header -->
    <path d="M 0 6 C 0 2.5 2.5 0 6 0 L 288 0 C 291.5 0 294 2.5 294 6 L 294 36 L 0 36 Z" fill="#1c2128" />
    <line x1="0" y1="36" x2="294" y2="36" stroke="#30363d" stroke-width="1" />

    <circle cx="16" cy="18" r="8" fill="#da3633" />
    <text class="font-sans" x="16" y="22" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">3</text>
    <text class="font-sans" x="32" y="22" fill="#e6edf3" font-size="12" font-weight="600">CATCH DRIFT</text>
    <text class="font-sans" x="280" y="22" fill="#f85149" font-size="11" font-weight="600" text-anchor="end">Trajectory Diff</text>

    <!-- Terminal Code Block -->
    <g transform="translate(12, 48)">
      <rect class="c-inner-bg" x="0" y="0" width="270" height="318" rx="4" />
      <rect class="c-border-subtle" x="0.5" y="0.5" width="269" height="317" rx="4" />

      <g class="font-mono" transform="translate(12, 22)">
        <!-- Failure header -->
        <text x="0" y="0"><tspan class="c-red" font-weight="600">FAILED </tspan><tspan class="c-text">DivergenceError</tspan></text>
        
        <text x="0" y="24" class="c-amber">Agent trajectory changed:</text>

        <!-- Expected / Actual context -->
        <text x="0" y="52" class="c-dim">Expected:</text>
        <text x="10" y="68" class="c-muted">1. model_request</text>
        <text x="10" y="84" class="c-muted">2. tool: lookup_customer</text>
        <text x="10" y="100" class="c-blue">3. tool: check_policy</text>

        <text x="0" y="128" class="c-dim">Actual (prompt skipped check):</text>
        <text x="10" y="144" class="c-muted">1. model_request</text>
        <text x="10" y="160" class="c-muted">2. tool: lookup_customer</text>
        <text x="10" y="176" class="c-red">3. tool: refund_customer</text>

        <!-- Structural Diff Snippet -->
        <g transform="translate(0, 192)">
          <rect class="diff-del-bg" x="0" y="0" width="246" height="20" rx="3" />
          <text class="diff-del-text" x="6" y="14">- 3. tool_call: check_policy</text>

          <rect class="diff-add-bg" x="0" y="24" width="246" height="20" rx="3" />
          <text class="diff-add-text" x="6" y="38">+ 3. tool_call: refund_customer</text>
        </g>

        <!-- Summary line -->
        <line x1="0" y1="250" x2="246" y2="250" stroke="#21262d" stroke-width="1" />
        <text x="0" y="272"><tspan class="c-red" font-weight="600">1 failed</tspan><tspan class="c-dim"> in 0.05s (caught in CI)</tspan></text>
      </g>
    </g>
  </g>
</svg>
