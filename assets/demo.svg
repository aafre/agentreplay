<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      
      .bg { fill: #0d1117; }
      .bar { fill: #161b22; }
      .border { stroke: #30363d; stroke-width: 1px; fill: none; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      
      .tab-font {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 600;
      }
      
      .term-text {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, Monaco, monospace;
        font-size: 13.5px;
        line-height: 22px;
      }
      
      .prompt { fill: #58a6ff; font-weight: 700; }
      .cmd { fill: #f0f6fc; font-weight: 500; }
      .success-title { fill: #3fb950; font-weight: 700; }
      .success-text { fill: #7ee787; }
      .muted { fill: #8b949e; }
      .fail-title { fill: #f85149; font-weight: 700; }
      .diff-del { fill: #ffa198; }
      .diff-add { fill: #7ee787; }
      .diff-header { fill: #e3b341; font-weight: 600; }
      .step-num { fill: #79c0ff; }
      .time-tag { fill: #d2a8ff; font-weight: 600; }
      .badge-tag { fill: #58a6ff; }
      
      /* Blinking Cursor */
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        fill: #58a6ff;
        animation: blink 0.9s infinite;
      }
      
      /* Progress Bar Animations */
      @keyframes progressBar {
        0% { width: 0px; }
        30% { width: 850px; }
        33.3% { width: 0px; }
        63.3% { width: 850px; }
        66.6% { width: 0px; }
        96.6% { width: 850px; }
        100% { width: 0px; }
      }
      .progress-fill {
        animation: progressBar 15s linear infinite;
      }
      
      /* Tab Highlight Animations */
      @keyframes tab1Highlight {
        0%, 31.5% { fill: #58a6ff; opacity: 1; }
        33.3%, 100% { fill: #8b949e; opacity: 0.5; }
      }
      @keyframes tab2Highlight {
        0%, 33.3% { fill: #8b949e; opacity: 0.5; }
        34.5%, 64.5% { fill: #3fb950; opacity: 1; }
        66.6%, 100% { fill: #8b949e; opacity: 0.5; }
      }
      @keyframes tab3Highlight {
        0%, 66.6% { fill: #8b949e; opacity: 0.5; }
        67.8%, 98% { fill: #f85149; opacity: 1; }
        100% { fill: #8b949e; opacity: 0.5; }
      }
      
      .tab1-text { animation: tab1Highlight 15s infinite; }
      .tab2-text { animation: tab2Highlight 15s infinite; }
      .tab3-text { animation: tab3Highlight 15s infinite; }
      
      @keyframes tab1Bg {
        0%, 31.5% { opacity: 1; }
        33.3%, 100% { opacity: 0; }
      }
      @keyframes tab2Bg {
        0%, 33.3% { opacity: 0; }
        34.5%, 64.5% { opacity: 1; }
        66.6%, 100% { opacity: 0; }
      }
      @keyframes tab3Bg {
        0%, 66.6% { opacity: 0; }
        67.8%, 98% { opacity: 1; }
        100% { opacity: 0; }
      }
      
      .tab1-pill { animation: tab1Bg 15s infinite; fill: #1f293d; stroke: #388bfd; stroke-width: 1px; }
      .tab2-pill { animation: tab2Bg 15s infinite; fill: #1c2e24; stroke: #2ea043; stroke-width: 1px; }
      .tab3-pill { animation: tab3Bg 15s infinite; fill: #321c1f; stroke: #da3633; stroke-width: 1px; }

      /* Content Switch Animations */
      @keyframes showPhase1 {
        0%, 2% { opacity: 0; transform: translateY(6px); }
        3%, 31% { opacity: 1; transform: translateY(0); }
        32.5%, 100% { opacity: 0; transform: translateY(-6px); }
      }
      @keyframes showPhase2 {
        0%, 33% { opacity: 0; transform: translateY(6px); }
        35%, 64% { opacity: 1; transform: translateY(0); }
        65.5%, 100% { opacity: 0; transform: translateY(-6px); }
      }
      @keyframes showPhase3 {
        0%, 66.6% { opacity: 0; transform: translateY(6px); }
        68%, 97.5% { opacity: 1; transform: translateY(0); }
        99%, 100% { opacity: 0; transform: translateY(-6px); }
      }

      .phase1 { animation: showPhase1 15s infinite; }
      .phase2 { animation: showPhase2 15s infinite; }
      .phase3 { animation: showPhase3 15s infinite; }
    </style>
    
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
  </defs>

  <!-- Window Container -->
  <rect class="bg" x="0" y="0" width="850" height="510" rx="10" />
  <rect class="border" x="0.5" y="0.5" width="849" height="509" rx="10" />

  <!-- Window Header -->
  <rect class="bar" x="0" y="0" width="850" height="42" rx="10" />
  <rect class="bar" x="0" y="32" width="850" height="10" />
  <line x1="0" y1="42" x2="850" y2="42" stroke="#30363d" stroke-width="1" />
  
  <!-- Window Dots -->
  <circle class="dot-red" cx="20" cy="21" r="6" />
  <circle class="dot-yellow" cx="38" cy="21" r="6" />
  <circle class="dot-green" cx="56" cy="21" r="6" />

  <!-- Interactive Step Tabs in Header -->
  <g class="tab-font">
    <!-- Tab 1 -->
    <rect class="tab1-pill" x="120" y="8" width="180" height="26" rx="6" />
    <text class="tab1-text" x="210" y="25" text-anchor="middle">● 1. Record Mode</text>
    
    <!-- Tab 2 -->
    <rect class="tab2-pill" x="320" y="8" width="190" height="26" rx="6" />
    <text class="tab2-text" x="415" y="25" text-anchor="middle">● 2. Fast Replay (0s)</text>
    
    <!-- Tab 3 -->
    <rect class="tab3-pill" x="530" y="8" width="200" height="26" rx="6" />
    <text class="tab3-text" x="630" y="25" text-anchor="middle">● 3. Trajectory Diff</text>
  </g>

  <!-- Timeline Progress Bar at bottom of header -->
  <rect x="0" y="41" width="850" height="2" fill="#21262d" />
  <rect class="progress-fill" x="0" y="41" width="0" height="2" fill="url(#progressGrad)" />

  <!-- Live Animation Indicator Badge (Top Right) -->
  <g transform="translate(755, 12)">
    <circle cx="8" cy="9" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="13" fill="#7ee787" font-family="'Inter', sans-serif" font-size="11" font-weight="600">LIVE</text>
  </g>

  <!-- ================= SCENE 1: RECORDING ================= -->
  <g class="term-text phase1">
    <text x="25" y="80"><tspan class="prompt">$ </tspan><tspan class="cmd">pytest --agentreplay=record tests/test_support.py</tspan><tspan class="cursor">▋</tspan></text>
    <text x="25" y="115" class="muted">collecting ... collected 1 item</text>
    
    <text x="25" y="155" class="success-title">RECORD  </text><text x="95" y="155" class="muted">tests/cassettes/test_support/test_refund_flow.jsonl</text>
    <text x="25" y="185" class="success-text">  ✓ Intercepted via PydanticAI capability hooks</text>
    <text x="25" y="210" class="success-text">  ✓ 2 model request/response turns captured</text>
    <text x="25" y="235" class="success-text">  ✓ 3 tool calls recorded (lookup_customer, check_policy, refund)</text>
    <text x="25" y="260" class="success-text">  ✓ Canonical JSONL cassette saved (format_version=1)</text>
    
    <text x="25" y="310" class="muted">tests/test_support.py::test_refund_flow </text><text x="350" y="310" class="success-title">PASSED</text><text x="420" y="310" class="muted"> [100%]</text>
    
    <text x="25" y="360"><tspan class="success-title">====================== 1 passed </tspan><tspan class="muted">in 2.45s (recorded to disk) ======================</tspan></text>
    
    <rect x="25" y="395" width="800" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="40" y="421" fill="#79c0ff" font-size="12.5" font-family="'JetBrains Mono', monospace">💡 Tip: Commit the generated JSONL cassette to Git for offline CI replay.</text>
  </g>

  <!-- ================= SCENE 2: REPLAYING OFFLINE ================= -->
  <g class="term-text phase2">
    <text x="25" y="80"><tspan class="prompt">$ </tspan><tspan class="cmd">pytest --agentreplay=replay tests/test_support.py</tspan><tspan class="cursor">▋</tspan></text>
    <text x="25" y="115" class="muted">collecting ... collected 1 item</text>
    
    <text x="25" y="155" class="success-title">REPLAY  </text><text x="95" y="155" class="muted">tests/cassettes/test_support/test_refund_flow.jsonl</text>
    <text x="25" y="185" class="success-text">  ✓ ZERO live model API calls (skipped via SkipModelRequest)</text>
    <text x="25" y="210" class="success-text">  ✓ ZERO tool/network execution (skipped via SkipToolExecution)</text>
    <text x="25" y="235" class="success-text">  ✓ Replay position cursor matched all 7 cassette events</text>
    <text x="25" y="260" class="success-text">  ✓ 100% deterministic test execution</text>
    
    <text x="25" y="310" class="muted">tests/test_support.py::test_refund_flow </text><text x="350" y="310" class="success-title">PASSED</text><text x="420" y="310" class="muted"> [100%]</text>
    
    <text x="25" y="360"><tspan class="success-title">====================== 1 passed </tspan><tspan class="time-tag">in 0.04s </tspan><tspan class="success-title">(60x faster / zero tokens used) ======================</tspan></text>
    
    <rect x="25" y="395" width="800" height="42" rx="6" fill="#161b22" stroke="#2ea043" stroke-width="1" />
    <text x="40" y="421" fill="#7ee787" font-size="12.5" font-family="'JetBrains Mono', monospace">⚡ CI Ready: Ultra-fast offline regression tests without API keys or costs.</text>
  </g>

  <!-- ================= SCENE 3: BEHAVIOURAL DRIFT DETECTED ================= -->
  <g class="term-text phase3">
    <text x="25" y="75"><tspan class="prompt">$ </tspan><tspan class="cmd">pytest --agentreplay=replay tests/test_support.py</tspan><tspan class="cursor">▋</tspan></text>
    <text x="25" y="105" class="fail-title">FAILED tests/test_support.py::test_refund_flow - DivergenceError</text>
    
    <text x="25" y="135" class="diff-header">Agent trajectory changed</text>
    
    <text x="25" y="165" class="muted">Expected:</text>
    <text x="45" y="190" class="muted">1. model_request → 2. <tspan class="step-num">tool: lookup_customer(id="123")</tspan></text>
    <text x="45" y="215" class="muted">3. <tspan class="step-num">tool: check_refund_policy(tier="gold")</tspan> → 4. <tspan class="step-num">tool: refund_customer(amount=39)</tspan></text>
    
    <text x="25" y="250" class="muted">Actual (Agent prompt update accidentally skipped policy check):</text>
    <text x="45" y="275" class="muted">1. model_request → 2. <tspan class="step-num">tool: lookup_customer(id="123")</tspan></text>
    <text x="45" y="300" class="muted">3. <tspan class="step-num">tool: refund_customer(amount=39)</tspan></text>
    
    <text x="25" y="335" class="fail-title">Divergence at step 3:</text>
    <text x="45" y="360" class="diff-del">- tool_call: check_refund_policy(tier="gold")</text>
    <text x="45" y="385" class="diff-add">+ tool_call: refund_customer(amount=39)</text>
    
    <text x="25" y="425"><tspan class="fail-title">====================== 1 failed </tspan><tspan class="muted">in 0.05s ======================</tspan></text>
    
    <rect x="25" y="448" width="800" height="38" rx="6" fill="#161b22" stroke="#da3633" stroke-width="1" />
    <text x="40" y="472" fill="#ffa198" font-size="12" font-family="'JetBrains Mono', monospace">🔍 Instant Root-Cause: Clearly shows the exact tool &amp; argument drift.</text>
  </g>
</svg>
